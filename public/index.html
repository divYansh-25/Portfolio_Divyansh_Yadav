<!DOCTYPE html>
<html lang="en">

<head>
  <!-- =========================
       BASIC META TAGS
  ========================== -->
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <!-- =========================
       PRIMARY SEO
  ========================== -->
  <title>Divyansh Yadav | Full Stack Developer & MERN Developer</title>

  <meta
    name="description"
    content="Portfolio of Divyansh Yadav, a Full Stack Developer specializing in React.js, MERN Stack, Java, DSA, and modern scalable web applications. Explore my projects, skills, and experience."
  />

  <meta name="author" content="Divyansh Yadav" />

  <meta
    name="keywords"
    content="Divyansh Yadav, Full Stack Developer, MERN Stack Developer, React Developer, Java Developer, Web Developer, Software Developer, DSA, MongoDB, Express.js, React.js, Node.js"
  />

  <!-- Search Engine Crawling -->
  <meta
    name="robots"
    content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1"
  />

  <meta name="googlebot" content="index, follow" />

  <!-- =========================
       CANONICAL URL
       Replace with actual portfolio URL
  ========================== -->
  <link
    rel="canonical"
    href="https://divyanshyadav.in/"
  />

  <!-- =========================
       FAVICONS
  ========================== -->
  <link
    rel="icon"
    type="image/x-icon"
    href="/favicon.ico"
  />

  <link
    rel="icon"
    type="image/png"
    sizes="16x16"
    href="/favicon-16x16.png"
  />

  <link
    rel="icon"
    type="image/png"
    sizes="32x32"
    href="/favicon-32x32.png"
  />

  <link
    rel="icon"
    type="image/png"
    sizes="48x48"
    href="/favicon-48x48.png"
  />

  <link
    rel="icon"
    type="image/png"
    sizes="96x96"
    href="/favicon-96x96.png"
  />

  <link
    rel="apple-touch-icon"
    sizes="180x180"
    href="/apple-touch-icon.png"
  />

  <link
    rel="manifest"
    href="/site.webmanifest"
  />

  <!-- Browser Theme -->
  <meta
    name="theme-color"
    content="#0a0a0a"
  />

  <!-- =========================
       OPEN GRAPH
       LinkedIn / WhatsApp / Facebook
  ========================== -->
  <meta
    property="og:type"
    content="website"
  />

  <meta
    property="og:title"
    content="Divyansh Yadav | Full Stack Developer"
  />

  <meta
    property="og:description"
    content="Explore the portfolio of Divyansh Yadav — a Full Stack Developer building modern web applications with React, MERN Stack, Java, and scalable technologies."
  />

  <meta
    property="og:url"
    content="https://divyanshyadav.in/"
  />

  <meta
    property="og:site_name"
    content="Divyansh Yadav Portfolio"
  />

  <meta
    property="og:image"
    content="https://divyanshyadav.in/android-chrome-512x512.png"
  />

  <meta
    property="og:image:alt"
    content="Divyansh Yadav - Full Stack Developer Portfolio"
  />

  <meta
    property="og:image:width"
    content="1200"
  />

  <meta
    property="og:image:height"
    content="630"
  />

  <meta
    property="og:locale"
    content="en_IN"
  />

  <!-- =========================
       TWITTER / X
  ========================== -->
  <meta
    name="twitter:card"
    content="summary_large_image"
  />

  <meta
    name="twitter:title"
    content="Divyansh Yadav | Full Stack Developer"
  />

    name="twitter:description"

  />

    content="https://divyanshyadav.in/portfolio-preview.png"
  />

  <meta
    name="twitter:image:alt"
    content="Divyansh Yadav - Full Stack Developer Portfolio"
  />

       STRUCTURED DATA / JSON-LD
       Helps Google understand who you are
  ========================== -->

    "@context": "https://schema.org",
    "@type": "Person",
    "name": "Divyansh Yadav",
    "url": "https://divyanshyadav.in/",
    "image": "https://divyanshyadav.in/android-chrome-512x512.png",
    "jobTitle": "Full Stack Developer",
    "description": "Full Stack Developer specializing in React.js, MERN Stack, Java, DSA, and modern scalable web applications.",

      "Full Stack Web Development",
      "React.js",
      "JavaScript",
      "Node.js",
      "Express.js",
      "MongoDB",
      "MERN Stack",
      "Java",
      "Data Structures and Algorithms",
      "Web Development"
    ]
  }
  </script>

  <!-- =========================
       WEBSITE STRUCTURED DATA
  ========================== -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",

    "name": "Divyansh Yadav Portfolio",

    "description": "Personal portfolio of Divyansh Yadav, Full Stack Developer specializing in React, MERN Stack, Java, and modern web development.",

    }
  }

</head>
